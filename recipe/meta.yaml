{% set name = "fla-core" %}
{% set version = "0.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/{{ name }}/fla_core-{{ version }}.tar.gz
  sha256: 38ab28966eeadc2141b29e87c2bf72a8a4851e00af9d25bbbc3596b1fb53450d

build:
  number: 0
  # triton (a runtime dep of fla.ops / fla.modules) is only available on
  # linux-64 on pkgs/main.
  skip: true  # [not linux64]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - pytorch
    - einops
    # triton is not declared in 0.4.1's [project.dependencies] (only torch +
    # einops), but fla.ops / fla.modules import it — it is a hard runtime dep.
    - triton
    # packaging is also undeclared upstream but imported eagerly by fla.utils
    # (from packaging import version). It is not reliably pulled in transitively
    # (py3.14 test env lacked it), so declare it explicitly.
    - packaging

test:
  imports:
    # fla/__init__.py is a namespace-package stub (pkgutil.extend_path); import
    # the actual fla-core subpackages so the test exercises real code (and its
    # torch / einops / triton deps), not just the empty namespace.
    - fla
    - fla.ops
    - fla.modules
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/fla-org/flash-linear-attention
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Core operations for flash-linear-attention
  description: |
    fla-core provides the core Triton-based operators and modules of the
    flash-linear-attention project, implementing efficient linear-attention and
    related sequence-modeling kernels for PyTorch.
  doc_url: https://github.com/fla-org/flash-linear-attention
  dev_url: https://github.com/fla-org/flash-linear-attention

extra:
  skip-lints:
    # pytorch is a CBC-pinned runtime-only dep (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
    - chrisdeutsch
